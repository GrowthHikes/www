<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Outer Gradient -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Metallic Gold Highlight Gradient -->
    <linearGradient id="goldBar" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Cyber Gradient -->
    <linearGradient id="emeraldBar" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="60%" stop-color="#1ddca8" />
      <stop offset="85%" stop-color="#8dffe0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Black Square Base -->
  <rect width="200" height="200" rx="36" fill="#030407" />

  <!-- Rotated Diamond Bezel Frame -->
  <g transform="translate(100, 100) rotate(45)">
    <rect
      x="-56"
      y="-56"
      width="112"
      height="112"
      rx="18"
      fill="none"
      stroke="url(#goldOuter)"
      stroke-width="3.5"
      stroke-opacity="0.9"
    />
    <rect
      x="-50"
      y="-50"
      width="100"
      height="100"
      rx="14"
      fill="none"
      stroke="url(#goldOuter)"
      stroke-width="1"
      stroke-opacity="0.35"
    />
  </g>

  <!-- 3 Stepped Growth Bars terminating in Upward Arrow -->
  <g filter="url(#goldGlow)">
    <!-- Bar 1 (Left - Shortest) -->
    <path
      d="M 52 118 L 74 94 Q 78 89 84 94 L 88 98 Q 92 103 87 109 L 66 132 Q 60 138 54 133 L 51 129 Q 47 124 52 118 Z"
      fill="url(#goldBar)"
    />

    <!-- Bar 2 (Middle - Stepped Higher) -->
    <path
      d="M 76 108 L 105 76 Q 109 71 115 76 L 119 80 Q 123 85 118 91 L 90 122 Q 84 128 78 123 L 75 119 Q 71 114 76 108 Z"
      fill="url(#goldBar)"
    />

    <!-- Bar 3 (Right - Highest with Upward Arrow Tip) -->
    <path
      d="M 100 98 L 126 69 L 118 69 Q 115 69 116 65 L 117 63 Q 118 60 122 60 L 148 60 Q 152 60 152 64 L 152 90 Q 152 94 148 94 L 146 94 Q 142 94 142 90 L 142 82 L 114 113 Q 108 119 102 114 L 99 110 Q 95 104 100 98 Z"
      fill="url(#goldBar)"
    />
  </g>
</svg>
