<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Outer Gradient -->
    <linearGradient id="goldOuterFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Metallic Gold Highlight Gradient -->
    <linearGradient id="goldBarFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="goldGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark (x=60, y=60) -->
  <g transform="translate(60, 60)">
    <!-- Rotated Diamond Bezel Frame -->
    <g transform="rotate(45)">
      <rect
        x="-38"
        y="-38"
        width="76"
        height="76"
        rx="12"
        fill="none"
        stroke="url(#goldOuterFull)"
        stroke-width="2.5"
        stroke-opacity="0.9"
      />
      <rect
        x="-33"
        y="-33"
        width="66"
        height="66"
        rx="9"
        fill="none"
        stroke="url(#goldOuterFull)"
        stroke-width="1"
        stroke-opacity="0.3"
      />
    </g>

    <!-- 3 Stepped Bars with Arrow Tip -->
    <g transform="translate(-60, -60) scale(0.6)" filter="url(#goldGlowFull)">
      <!-- Bar 1 (Left) -->
      <path
        d="M 52 118 L 74 94 Q 78 89 84 94 L 88 98 Q 92 103 87 109 L 66 132 Q 60 138 54 133 L 51 129 Q 47 124 52 118 Z"
        fill="url(#goldBarFull)"
      />
      <!-- Bar 2 (Middle) -->
      <path
        d="M 76 108 L 105 76 Q 109 71 115 76 L 119 80 Q 123 85 118 91 L 90 122 Q 84 128 78 123 L 75 119 Q 71 114 76 108 Z"
        fill="url(#goldBarFull)"
      />
      <!-- Bar 3 (Right with Arrow) -->
      <path
        d="M 100 98 L 126 69 L 118 69 Q 115 69 116 65 L 117 63 Q 118 60 122 60 L 148 60 Q 152 60 152 64 L 152 90 Q 152 94 148 94 L 146 94 Q 142 94 142 90 L 142 82 L 114 113 Q 108 119 102 114 L 99 110 Q 95 104 100 98 Z"
        fill="url(#goldBarFull)"
      />
    </g>
  </g>

  <!-- Brand Wordmark Typography -->
  <g transform="translate(130, 0)">
    <!-- Primary Title: GROWTH HIKES -->
    <text
      x="0"
      y="66"
      font-family="system-ui, -apple-system, 'Space Grotesk', 'Plus Jakarta Sans', sans-serif"
      font-size="36"
      font-weight="800"
      letter-spacing="-0.02em"
      fill="#ffffff"
    >
      GROWTH<tspan fill="#f59e0b">HIKES</tspan>
    </text>

    <!-- Subtitle: UNLOCK YOUR POTENTIAL -->
    <text
      x="2"
      y="90"
      font-family="system-ui, -apple-system, 'Space Grotesk', 'Plus Jakarta Sans', sans-serif"
      font-size="11.5"
      font-weight="700"
      letter-spacing="0.28em"
      fill="#94a3b8"
    >
      UNLOCK YOUR POTENTIAL
    </text>
  </g>
</svg>
